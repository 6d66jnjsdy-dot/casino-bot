<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mines Predict</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 600px;
      background: #1f2937;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border: 0;
      outline: 0;
      border-radius: 10px;
      background: #374151;
      color: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #5865f2;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }

    button:hover {
      opacity: .9;
    }

    .secondary {
      background: #374151;
    }

    #output {
      margin-top: 15px;
      padding: 15px;
      background: #111827;
      border-radius: 10px;
      line-height: 1.8;
      word-break: break-word;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
      margin-top: 15px;
    }

    .cell {
      aspect-ratio: 1;
      background: #374151;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .bomb {
      background: #991b1b;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>💣 Mines Predict</h1>

  <input
    id="messageId"
    type="text"
    inputmode="numeric"
    placeholder="Message ID"
  >

  <button onclick="predict()">
    🔮 Predict
  </button>

  <div id="output">
    הכנס Message ID של משחק שנשמר במערכת.
  </div>

  <div id="grid" class="grid"></div>

  <hr style="border-color:#374151;margin:25px 0">

  <h3>🛠️ יצירת משחק Debug</h3>

  <input
    id="newMessageId"
    type="text"
    inputmode="numeric"
    placeholder="Message ID חדש"
  >

  <input
    id="bombs"
    type="text"
    placeholder="מיקומי פצצות, לדוגמה: 3,8,12"
  >

  <button class="secondary" onclick="createGame()">
    💾 שמור משחק
  </button>

</div>

<script>

async function getGames() {
  const response = await fetch("/api/games", {
    cache: "no-store"
  });

  return await response.json();
}

async function predict() {
  const messageId =
    document.getElementById("messageId").value.trim();

  const output =
    document.getElementById("output");

  const grid =
    document.getElementById("grid");

  grid.innerHTML = "";

  if (!/^\d+$/.test(messageId)) {
    output.innerHTML = "❌ הכנס Message ID תקין.";
    return;
  }

  try {
    const games = await getGames();
    const game = games[messageId];

    if (!game) {
      output.innerHTML =
        "❌ לא נמצא משחק עם ה־Message ID הזה.";
      return;
    }

    if (!game.debug) {
      output.innerHTML =
        "🔒 המשחק אינו במצב Debug.";
      return;
    }

    const bombs = Array.isArray(game.bombs)
      ? game.bombs.map(Number)
      : [];

    output.innerHTML = `
      🔮 <b>PREDICT</b><br><br>
      📨 Message ID: <b>${messageId}</b><br>
      💣 מספר פצצות: <b>${bombs.length}</b><br>
      📍 מיקומים: <b>${bombs.map(x => x + 1).join(", ")}</b>
    `;

    for (let i = 0; i < 25; i++) {
      const cell = document.createElement("div");

      cell.className = "cell";

      if (bombs.includes(i)) {
        cell.classList.add("bomb");
        cell.textContent = "💣";
      } else {
        cell.textContent = i + 1;
      }

      grid.appendChild(cell);
    }

  } catch {
    output.innerHTML =
      "❌ שגיאה בטעינת נתוני המשחק.";
  }
}
